# SentinelGate Zero-Trust Security Gateway Architecture
# Topology:
#   - gateway: Public-facing zero-trust reverse proxy (published port 8000)
#   - backend: Internal protected service (isolated network, no exposed ports)
#   - postgres: Relational store for users, policies, and immutable audit logs
#   - redis: In-memory store for distributed rate limiting counters and security event tracking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-too}
      POSTGRES_DB: sentinelgate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelgate -d sentinelgate"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Internal backend microservice: business logic only.
  # Network isolated: No published ports, reachable only by the gateway.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.internal.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # In-container network endpoints
      DATABASE_URL: postgresql://sentinelgate:${POSTGRES_PASSWORD:-change-me-too}@postgres:5432/sentinelgate
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8001
      DLP_ENGINE_PATH: /app/dlp-engine
    ports:
      - "8000:8000"   # External ingress point
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
